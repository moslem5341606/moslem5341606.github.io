<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" role="img" aria-labelledby="title desc"><title id="title">From modelling to energy decisions</title><desc id="desc">Data and modelling inform optimisation and control, which are evaluated for cost, reliability and carbon outcomes.</desc><rect width="1000" height="280" fill="#fafafa"/><g font-family="system-ui,Arial,sans-serif" fill="#222"><text x="35" y="47" font-size="13" font-weight="700" letter-spacing="2">RESEARCH PATHWAY</text></g><g stroke="#999" stroke-width="2" fill="none"><path d="M265 137H367"/><path d="M632 137H734"/></g><g fill="#555"><path d="m360 132 10 5-10 5z"/><path d="m727 132 10 5-10 5z"/></g><g stroke="#303030" stroke-width="2" fill="#fff"><rect x="35" y="84" width="230" height="107"/><rect x="370" y="84" width="260" height="107" fill="#111" stroke="#111"/><rect x="735" y="84" width="230" height="107"/></g><g font-family="system-ui,Arial,sans-serif" text-anchor="middle"><text x="150" y="122" font-size="18" font-weight="700" fill="#222">System data</text><text x="150" y="153" font-size="14" fill="#666">generation · demand · storage</text><text x="500" y="122" font-size="18" font-weight="700" fill="#fff">Decision methods</text><text x="500" y="153" font-size="14" fill="#ddd">models · optimisation · AI</text><text x="850" y="122" font-size="18" font-weight="700" fill="#222">Evaluation</text><text x="850" y="153" font-size="14" fill="#666">cost · resilience · emissions</text></g><text x="35" y="247" font-size="12" font-family="system-ui,Arial,sans-serif" fill="#666">Conceptual research workflow · outcomes depend on the case study and assumptions</text></svg>